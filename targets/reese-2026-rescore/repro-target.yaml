# Manifest written 2026-09-27. Claims and tolerances were committed before any scored run.
# Every value below was read from a source opened on 2026-09-27; the URL or API call is named beside it.

schema_version: 1
slug: reese-2026-rescore
status: selected

paper:
  title: "Systematic benchmarking demonstrates large language models have not reached the diagnostic accuracy of traditional rare-disease decision support tools"
  doi: 10.1038/s41431-026-02054-5
  journal: European Journal of Human Genetics
  year: 2026
  first_author: Reese
  last_author: Robinson
  url: https://doi.org/10.1038/s41431-026-02054-5
  # Crossref 2026-09-27: volume 34, pages 498-504, published 2026-02-24, CC-BY 4.0.
  # Preprint: medRxiv 10.1101/2024.07.22.24310816 v3 = PMC11302616.

code:
  - role: pipeline
    repo: https://github.com/monarch-initiative/pheval.llm
    commit: bd7146d15798b4dd968fd64bc9a42e6971aa8fae
    # 2025-05-27, the commit that added topn_result_*.tsv. `git diff --stat bd7146d a1b38c0 --
    # src/malco/process/`: 7 files changed, 248 insertions(+), 89 deletions(-) (cleaning, generate_plots,
    # grounding, mondo_score_utils, process, scoring, summary). Read file by file: no change to any
    # function called here (formatting, type hints, `== None` -> `is None`, a mutable default replaced
    # by the same value); summary.py's n10p/nf columns differ, but summarize() is not called here.
    licence: BSD-3-Clause
    entrypoint: "malco functions called by score_rescore.py (see deviations)"

environment:
  kind: docker
  spec: Dockerfile
  python: "3.12"           # pyproject.toml at bd7146d: python = "^3.12"
  notes: >
    malco's poetry.lock at bd7146d is installed unchanged (Poetry 1.8.4, the version that generated it),
    into /opt/venv; env-resolved.txt is its pip freeze. The lock pins curategpt 0.2.3, which requires
    openai 1.65.4 and llm 0.15 as non-optional dependencies, and malco/__init__ imports main, which
    imports grounding.py, which imports curategpt.store. So these clients are present in the image. They
    are unreachable at run time: the container runs with --network none, run.sh performs a network check
    (DNS lookup of api.openai.com and a TCP connection to port 443, 5 s timeout) before scoring and prints
    "== network check: unreachable (...)", exiting non-zero if either succeeds, and no key variable is set
    in the container. The CurateGPT path is never called (use_ontogpt_grounding=False). This is an
    environment note, not a code deviation: the paper's code is not modified. Checked before the run
    under --network none: every import (malco, curategpt.store, openai, llm) succeeds offline in 14.5 s.
    build-essential is installed because chroma-hnswlib 0.7.3 (in the lock) has no Python 3.12 wheel and
    is compiled from its sdist. TQDM_DISABLE=1 keeps malco's progress bars out of scorer.log.
    oaklib 0.6.21 resolves sqlite:obo:mondo to a pystow cache file it would fetch from
    https://s3.amazonaws.com/bbop-sqlite/mondo.db.gz (403 on 2026-09-27); run.sh gunzips the pinned
    mondo.db.gz (below) into that cache location instead, with a fresh mtime so oaklib's one-week cache
    policy does not refetch.

