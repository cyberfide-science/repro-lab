checkpoints:
  max_download_gb: 5
  max_stage_minutes: 30

deviations:
  - what: "RS1-RS3: answer lines are grounded to Mondo by OAK exact matching only; malco's CurateGPT fallback is not run (use_ontogpt_grounding=False)"
    why: "The fallback queries an OpenAI embedding index at run time; the scored run makes no API call (--network none). Derived from the code: this can only lower the counts."
    approved_by: "Michael Wolfe, repro-lab maintainer"
    date: 2026-09-27
  - what: "RS4-RS6: lines OAK cannot ground are mapped with a one-time Claude Opus 5.5 table (grounding/opus-mondo-map.tsv, built with Claude Code headless under OAuth) instead of CurateGPT/OpenAI embeddings"
    why: "Reproduces the role of the paper's fallback step without a run-time API call; the table was built, validated (agreement with OAK on OAK-resolved names >= 0.90, fixed before the call) and committed before this run. It can move the counts in either direction."
    approved_by: "Michael Wolfe, repro-lab maintainer"
    date: 2026-09-27
  - what: "Opus mapping table (RS4-RS6, EX4): the echo check in grounding/build_opus_map.py compares echoed and input names after Unicode NFC normalisation, instead of byte-exact, from chunk 80 attempt 4 on"
    why: "Chunk 80 failed 3/3 only because the input Kohlschuetter-Toenz entry used decomposed diacritics (u/o + U+0308) that Opus echoed precomposed. Exact match implies NFC match, so the 94 accepted chunks are unaffected; only chunk 80 reruns; table names and lookups keep the input string byte-for-byte. Committed before chunk 80 reruns."
    approved_by: "Michael Wolfe, repro-lab maintainer"
    date: 2026-09-27

harness:
  image: repro-lab/reese-2026-rescore
  results_file: out/reese-2026-rescore/results.csv
  claim_keys:
    RS1: RS1_o1_top1_frac_floor
    RS2: RS2_o1_top3_frac_floor
    RS3: RS3_o1_top10_frac_floor
    RS4: RS4_o1_top1_frac_subst
    RS5: RS5_o1_top3_frac_subst
    RS6: RS6_o1_top10_frac_subst
  stages:
    - id: container_run
      cmd: ["docker", "run", "--rm", "--network", "none",
            "-v", "{repo_root}/data/reese-2026:/work/data:ro",
            "-v", "{repo_root}/out/reese-2026-rescore:/work/out",
            "repro-lab/reese-2026-rescore"]
      expected_minutes: <fill>

