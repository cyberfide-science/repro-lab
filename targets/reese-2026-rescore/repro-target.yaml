notes: >
  Expected: RS1–RS3 (offline floor) at or below the paper's values, likely outside tolerance by
  construction (the floor can only lower the counts). RS4–RS6 (substituted grounding) could land either
  side; the passing windows are 1228–1232, 1624–1629 and 1916–1920 cases. The paper-level verdict counts
  the floor claims, so it is expected to be `partially` or `not_reproduced` whatever RS4–RS6 show.

  Grounding gate, fixed before the first `claude -p` call (committed in grounding/build_opus_map.py as
  GATE = 0.90): the Opus table is used for RS4–RS6 only if its agreement with OAK on OAK-resolved names
  is at least 0.90. The gate is never lowered.

  Wording: a substituted-grounding claim within tolerance is "reproduced under substituted grounding",
  never plain "reproduced", because the paper's CurateGPT grounding step was not run. The floor is a
  lower bound for this pipeline, not a test of the paper's number.

  Mondo: the paper does not state its Mondo version. This run uses the SemSQL build with versionIRI
  obo:mondo/releases/2026-09-01/mondo.owl. The authors' score caches (copied from the clone to /work/run
  and used as their code does) cover the (ID, gold) pairs they scored; pairs they never saw are scored
  against this Mondo.

  Denominator: 5213, the line count of correct_results.tsv and the figure caption's "cohort of 5213
  cases"; 5212 response lines are scored (PMID_17886299_patient_BM5 appears twice in the gold file).
