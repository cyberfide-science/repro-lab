claims:
  # Pre-registered 2026-09-27, before any run. Values: PMC11302616 Figure 3 caption, "23.6% for the best
  # performing LLM (o1 preview) ... 31.2% in the top 3 ranks and 36.8% in the top 10 ranks"; top-1 also
  # in the EJHG abstract. Tolerance source (1): the paper reports one decimal of a percentage, so
  # +/-0.0005 as a fraction. Cross-check: pheval.llm@bd7146d topn_result_o1_preview.tsv cumulative
  # counts 1232/1626/1919 over 5213 = 0.23633/0.31191/0.36812, within 0.0005 of each claim.
  # Two grounding conditions; the tolerance absorbs neither.
  - id: RS1
    figure: "Figure 3 (medRxiv v3, PMC11302616)"
    panel: "Top-1, o1 preview — offline floor (OAK exact match only; CurateGPT step not run)"
    metric: fraction of 5213 cases with the correct diagnosis at rank 1, o1-preview, malco scoring rule
    value: 0.236
    tolerance: 0.0005
    tolerance_type: absolute
    extraction: manual
    source: "PMC11302616 Figure 3 caption, '23.6% for the best performing LLM (o1 preview)'"
  - id: RS2
    figure: "Figure 3 (medRxiv v3, PMC11302616)"
    panel: "Top-3, o1 preview — offline floor (OAK exact match only; CurateGPT step not run)"
    metric: fraction of 5213 cases with the correct diagnosis in ranks 1-3, o1-preview
    value: 0.312
    tolerance: 0.0005
    tolerance_type: absolute
    extraction: manual
    source: "PMC11302616 Figure 3 caption, '31.2% in the top 3 ranks'"
  - id: RS3
    figure: "Figure 3 (medRxiv v3, PMC11302616)"
    panel: "Top-10, o1 preview — offline floor (OAK exact match only; CurateGPT step not run)"
    metric: fraction of 5213 cases with the correct diagnosis in ranks 1-10, o1-preview
    value: 0.368
    tolerance: 0.0005
    tolerance_type: absolute
    extraction: manual
    source: "PMC11302616 Figure 3 caption, '36.8% in the top 10 ranks'"
  - id: RS4
