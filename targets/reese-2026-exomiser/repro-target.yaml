claims:
  # Pre-registered 2026-09-27 (whole cohort), before any run. Values: PMC11302616 Figure 3
  # caption, "Exomiser placed the correct diagnosis in the first rank in 35.5% of cases ... top 3
  # ranks ... 46.3% ... top 10 ranks in 58.5%". Cross-check: pheval.llm@bd7146d
  # topn_result_Exomiser.tsv cumulative counts 1852/2415/3047 over 5213.
  # Tolerance source (1), the authors' reporting precision: +/-0.0005. No sampling:
  # every case is run. Passing counts: EX1 1849-1853, EX2 2412-2416, EX3 3047-3052 (authors' 3047
  # is at the edge: 3047/5213 = 0.5845003).
  # Tie rule, pre-registered: disease items ordered by score descending, then sha256(disease_id as UTF-8)
  # ascending. The optimistic and pessimistic tie bands are evidence keys, not claims.
  - id: EX1
    figure: "Figure 3 (medRxiv v3, PMC11302616)"
    panel: "Top-1, Exomiser"
    metric: fraction of 5213 cases with the correct diagnosis at rank 1, Exomiser 14.0.1 / 2406 phenotype-only, malco scoring rule
    value: 0.355
    tolerance: 0.0005
    tolerance_type: absolute
    extraction: manual
    source: "PMC11302616 Figure 3 caption, '35.5% of cases'; EJHG abstract"
  - id: EX2
    figure: "Figure 3 (medRxiv v3, PMC11302616)"
    panel: "Top-3, Exomiser"
    metric: fraction of 5213 cases with the correct diagnosis in ranks 1-3
    value: 0.463
    tolerance: 0.0005
    tolerance_type: absolute
    extraction: manual
    source: "PMC11302616 Figure 3 caption, '46.3% of cases'"
  - id: EX3
    figure: "Figure 3 (medRxiv v3, PMC11302616)"
    panel: "Top-10, Exomiser"
    metric: fraction of 5213 cases with the correct diagnosis in ranks 1-10
    value: 0.585
    tolerance: 0.0005
    tolerance_type: absolute
    extraction: manual
    source: "PMC11302616 Figure 3 caption, '58.5% of cases'"

checkpoints:
  max_download_gb: 5
  max_stage_minutes: 30

deviations:
  - what: "EX4: o1-preview answers are grounded by OAK exact matching, then the one-time Claude Opus 5.5 table, instead of CurateGPT/OpenAI embeddings"
    why: "Same as reese-2026-rescore RS4-RS6: no run-time API call; the table is committed and hash-verified."
    approved_by: "Michael Wolfe, repro-lab maintainer"
    date: 2026-09-27
  - what: "Opus mapping table (RS4-RS6, EX4): the echo check in grounding/build_opus_map.py compares echoed and input names after Unicode NFC normalisation, instead of byte-exact, from chunk 80 attempt 4 on"
    why: "Chunk 80 failed 3/3 only because the input Kohlschuetter-Toenz entry used decomposed diacritics (u/o + U+0308) that Opus echoed precomposed. Exact match implies NFC match, so the 94 accepted chunks are unaffected; only chunk 80 reruns; table names and lookups keep the input string byte-for-byte. Committed before chunk 80 reruns."
    approved_by: "Michael Wolfe, repro-lab maintainer"
    date: 2026-09-27
  - what: "Opus mapping table, attempt 1 (committed at 851a94d): failed the pre-registered gate, agreement with OAK 0.2628 against 0.90; the prompt told the model to abstain when unsure, and it returned no match for 1,323 of 1,876 OAK-resolvable names. RS4-RS6 and EX4 were removed."
    why: "Recorded so the substituted-grounding claims show their full history."
    approved_by: "Michael Wolfe, repro-lab maintainer"
    date: 2026-09-27
  - what: "Opus mapping table, attempt 2 (the last): revised prompt, committed before any call, asks for the single best Mondo term plus a confidence (high/medium/low), and no match only when nothing plausible exists. The gate and its definition are unchanged; confidence is recorded but used neither by the gate nor by the lookup. RS4-RS6 and EX4 are restored only if this attempt passes."
    why: "Attempt 1 failed because of the abstention instruction, not the mapping procedure; one further attempt was authorised by the maintainer, with no third."
    approved_by: "Michael Wolfe, repro-lab maintainer"
    date: 2026-09-27

harness:
  image: repro-lab/reese-2026-exomiser
  results_file: out/reese-2026-exomiser/results.csv
  claim_keys:
    EX1: EX1_exomiser_top1_frac
    EX2: EX2_exomiser_top3_frac
    EX3: EX3_exomiser_top10_frac
  stages:
    - id: container_run
      # work/reese-2026-exomiser is mounted whole at /work/exo: the container writes raw/ (audit JSON,
      # rows 0001-0020), items/ (one reduced disease list per row) and raw_json.sha256 there.
      cmd: ["docker", "run", "--rm", "--network", "none", "--memory", "16g",
            "-v", "{repo_root}/data/reese-2026:/work/data:ro",
            "-v", "{repo_root}/work/reese-2026-exomiser:/work/exo",
            "-v", "{repo_root}/out/reese-2026-exomiser:/work/out",
            "repro-lab/reese-2026-exomiser"]
      expected_minutes: <fill>

notes: >
  Expected: EX1–EX3 at the pre-registered tie order (score, then sha256 of the disease id) may miss by a
  few cases even if our differential construction matches the authors', because large tie groups (1,462
  items at score 1.0 in the smoke case) make ranks depend on the order inside ties, which the authors do
  not report. The pessimistic-to-optimistic band is reported alongside, and the published values are
  expected to lie within it. EX3 fails at the point if even one case fewer than 3047 is found in the top
  10. EX4 true at the point.

  Tie rule and band. Exomiser 14.0.1's scores are deterministic but the order of tied items is not (three
  runs of one case: identical (disease_id, score) sets, different orders). The claim numbers use the
  pre-registered order above. Evidence keys give each count with tied items ordered best-first (_opt) and
  worst-first (_pess). A claim outside tolerance at the tie-rule point but whose claimed value lies inside
  the band is described as such, and stays not_reproduced.

  Differential construction (not published by the authors, fixed here): all genes (numGenes 0); disease
  items read as above; deduplicated by disease id keeping the highest score; ordered by the tie rule;
  ORPHA:/Orphanet: items mapped to Mondo by the pinned Mondo's skos:exactMatch, unmapped items kept in
  place and scoring 0; each item scored with malco's score_grounded_result against the case's gold
  (exomiser-gold.jsonl), with a copy of the authors' caches; is_correct = score > 0; a case with no item
  is "not found" and stays in the denominator (5213, as in reese-2026-rescore).

  Case list: cases.tsv, 5212 rows, resolved once by resolve_cases.py (0 unresolved, 0 ambiguous; one
  phenopacket, PMID_29330883_Subject_2, has no prompt id in the gold file and is not a case). File names
  inside the container use the row number, never the phenopacket id (27 ids contain "/", 66 contain
  U+00A0).

  The Opus mapping table's gate (agreement with OAK >= 0.90 on OAK-resolved names) was fixed before its
  first call; EX4 uses the table only if the gate passed.

  Amendment 2026-09-27, before any scored run: the Opus 5.5 mapping table failed its pre-registered
  gate (agreement with OAK on OAK-resolved names 0.2628 < 0.90; grounding/opus-mondo-map.meta.json),
  so, as pre-registered, the claims that depend on it are removed: EX4. The table stays committed as
  the record. The container still writes the substituted-grounding keys to results.csv; they are
  evidence only and back no claim. The deviation entries describing the table are kept unchanged.

  Finding recorded before any scored run (2026-09-27): the authors' committed malco caches cannot be read
  in this container (Berkeley DB 1.85-format files; Debian's dbm reports "BDB0210 ... metadata page
  checksum error" and malco's PersistentCache starts an empty cache). malco's code is run unchanged, so
  every (item, gold) pair is scored against the pinned Mondo; see the same note in reese-2026-rescore.
