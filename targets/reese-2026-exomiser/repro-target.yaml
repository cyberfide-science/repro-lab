# Manifest written 2026-09-27. Claims and tolerances were committed before any scored run.
# Every value below was read from a source opened on 2026-09-27; the URL or API call is named beside it.

schema_version: 1
slug: reese-2026-exomiser
status: selected

paper:
  title: "Systematic benchmarking demonstrates large language models have not reached the diagnostic accuracy of traditional rare-disease decision support tools"
  doi: 10.1038/s41431-026-02054-5
  journal: European Journal of Human Genetics
  year: 2026
  first_author: Reese
  last_author: Robinson
  url: https://doi.org/10.1038/s41431-026-02054-5
  # Crossref 2026-09-27: volume 34, pages 498-504, published 2026-02-24, CC-BY 4.0.
  # Preprint: medRxiv 10.1101/2024.07.22.24310816 v3 = PMC11302616.

code:
  - role: pipeline
    repo: https://github.com/exomiser/Exomiser
    commit: 7a4dc1e06bf489f7815a873ef6c34a83c3b2e99b
    # Tag 14.0.1 (gh api repos/exomiser/Exomiser/releases/tags/14.0.1, 2024-09-03). The program that runs
    # is the release's distribution zip (data[] exomiser_cli_14_0_1); the image holds a --depth 1 clone of
    # the tag only so that run.sh's first line reports the tag's commit.
    licence: AGPL-3.0
    entrypoint: "java -jar exomiser-cli-14.0.1.jar --batch <file> (--preset phenotype-only per case)"
  - role: pipeline
    repo: https://github.com/monarch-initiative/pheval.llm
    commit: bd7146d15798b4dd968fd64bc9a42e6971aa8fae
    # malco's score_grounded_result scores every Exomiser item; also grounds o1-preview for EX4.
    # poetry.lock installed unchanged, as in reese-2026-rescore.
    licence: BSD-3-Clause
    entrypoint: "malco functions called by score_exomiser.py"
  # pheval-exomiser is NOT a dependency: 0.4.13 requires oaklib<0.6.0, and malco's lock pins oaklib 0.6.21.
  # score_exomiser.py reads the same fields that
  # pheval_exomiser/post_process/post_process_results_format.py::extract_disease_results_from_json (0.4.13,
  # wheel sha256 9e39032fec9d14a0512c2340d13a392f448519b787c4f9e184d89e6e88c31183) selects:
  # priorityResults.HIPHIVE_PRIORITY.diseaseMatches[].model.diseaseId and .score, a null score read as 0.0
  # (fill_null(0.0)), rows with a null id dropped (drop_nulls()), a gene without HIPHIVE_PRIORITY giving
  # nothing. Checked 2026-09-27 in a throwaway environment with pheval-exomiser 0.4.13 (pheval 0.7.14,
  # polars 1.44.2): identical (disease_id, score) multisets on two cases (3937 and 8634 items).

environment:
  kind: docker
  spec: Dockerfile
  python: "3.12"           # pheval.llm pyproject.toml at bd7146d: python = "^3.12"
  notes: >
    Java: Eclipse Temurin 17 JRE copied by digest into the python:3.12-slim image (Exomiser 14.0.1 needs
    Java 17 or later). malco's poetry.lock is installed unchanged, as in reese-2026-rescore (curategpt,
    openai 1.65.4 and llm 0.15 are present and unreachable: --network none, and run.sh's network check).
    application.properties sets exomiser.phenotype.data-version=2406 and exomiser.hg19.data-version=2406.
    The hg19 data is a startup requirement, not a deviation: Exomiser 14.0.1 does not start without one
    genome assembly configured ("No GenomeAnalysisService instance provided! You must specify at least one
    exomiser genome assembly data version"), even for phenotype-only analysis. The analysis is
    --preset phenotype-only, no VCF is given, and no variant data enters any score; the paper's methods
    also name the 2406 release. Both data zips are extracted inside the container in this run from the
    hash-verified copies. Cases run in batches of 25 rows, 4 JVMs at a time, each with
    -Xmx3g (measured 2026-09-27: 4 concurrent 25-case batches, -Xmx3g, --memory 16g: 100 cases in 387 s, peak 14.5 GiB, no out-of-memory; one batch alone without -Xmx peaked at 6.6 GiB); Exomiser writes each JSON inside the container and after each batch every JSON is reduced to its disease items and deleted, except rows
    0001-0020, kept whole as an audit sample.
    The authors' committed score caches (caches/*.db, Berkeley DB 1.85 hash, macOS ndbm) are not readable
    by Python on Linux; malco opens an empty cache and scores every pair live against the pinned Mondo
    2026-09-01. A read-only conversion was attempted before any scored run (convert_caches.py, kept as the
    record and not called by run.sh): its reader read every pair (48,522 and 65,235, equal to the files'
    header counts; checks (a) and (b) passed), but the pre-registered check (c) required all 500 sampled
    score keys to be cache hits through malco's own code and 499 were: the missed key is
    ('MONDO:0007235', nan), a float NaN gold, which equals nothing and so can never be a hit. The 100%
    check failed, so the conversion was abandoned without a further attempt and the caches were left as
    they are.
    Genome assembly data (2406 hg19) is configured only because Exomiser 14.0.1 requires one to start;
    no VCF is given and the analysis is phenotype-only.

