# Exomiser 14.0.1 settings for the reese-2026-exomiser run. The data directory is filled in the run itself
# from the hash-verified 2406 zips. hg19 is configured only because 14.0.1 will not start without one
# genome assembly; the analysis is --preset phenotype-only with no VCF, so no variant data is used.
exomiser.data-directory=/work/exomiser-data
exomiser.phenotype.data-version=2406
exomiser.hg19.data-version=2406
logging.level.com.zaxxer.hikari=ERROR
