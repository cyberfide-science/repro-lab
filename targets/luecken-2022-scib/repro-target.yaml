environment:
  kind: docker
  spec: Dockerfile
  python: "3.7"            # as pinned in envs/scIB-python-paper.yml at e97631a
  notes: >
    Two environments are required. envs/scIB-python-paper.yml is the Python
    environment used for the paper; envs/scIB-R-integration.yml is the R one.
    Unit 1 scope is the Python environment only.

    KNOWN BREAK, recorded before the run. The planner read
    envs/scIB-python-paper.yml at e97631a on 2026-09-06 (GitHub contents API) and
    confirmed the pip block verbatim contains:

        - git+git://github.com/theislab/scib.git@0.2.0

    GitHub disabled the unauthenticated git:// protocol in March 2022, so
    `mamba env create -f envs/scIB-python-paper.yml` is expected to fail. The
    obvious fix (git+https://) is NOT applied here: it would be an edit to the
    paper's repo, which makes the untouched answer "no" by definition. It is
    logged as the first deviation and handed to Unit 2.

    SECOND, INDEPENDENT BLOCKER, also confirmed before the run. The planner read
    configs/reproduce_paper.yaml at e97631a on the same date. Its ROOT is
    /storage/groups/ml01/projects/2020_scIB_malte.luecken and every entry under
    DATA_SCENARIOS points at an absolute path on the authors' HPC filer, e.g.
    pancreas -> /storage/groups/ml01/workspace/maren.buettner/data_integration/
    data/human_pancreas/human_pancreas_norm.h5ad. Those paths do not exist
    outside the Theis lab, and the figshare file names are not the same strings.
    So even if the environment built, the paper config could not be run without
    editing it - which is also a deviation. Two independent blockers, both
    recorded, neither fixed in Unit 1.

    Note for the executor, not a licence to substitute: envs/scib-pipeline-R4.0.yml
    at the same SHA pins scib via git+https:// (not git://) and would probably
    resolve. It is NOT the paper environment and produces different numbers.
    Swapping to it is a deviation and requires a human checkpoint.

