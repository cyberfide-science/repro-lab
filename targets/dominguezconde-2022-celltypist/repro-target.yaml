    # HTTP 200, content-length 35730948, last-modified Sun, 31 Oct 2021 20:51:59 GMT.
    # This is the input used by the tutorial notebook whose committed outputs are
    # the claim source below.
    path: data/celltypist/demo_2000_cells.h5ad
    sha256: 167d038d57bc7aee2854f12c3337cc1f58846f4ae7382745639a0957831bae9b
    size_bytes: 35730948
  - id: model_immune_all_low_v2
    uri: https://celltypist.cog.sanger.ac.uk/models/Pan_Immune_CellTypist/v2/Immune_All_Low.pkl
    # HTTP 200, content-length 2824990, last-modified Sat, 16 Jul 2022 21:06:41 GMT.
    # The version is in the URL path (v2), which is why this URL is used instead
    # of the mutable models.json indirection. The last-modified date matches the
    # "date: 2022-07-16 00:20:42" the model prints in the tutorial notebook.
    path: data/celltypist/Immune_All_Low.pkl
    sha256: 290874d35dac039d4c9218c343fde4aac1077709b72a331ce7266f6828c36502
    size_bytes: 2824990

claims:
  # Pre-registered 2026-09-06, BEFORE any run.
  # Source for all four: committed outputs in
  #   https://raw.githubusercontent.com/Teichlab/celltypist/fe357564a6625d3b1732a022fd39f18e55696e80/docs/notebook/celltypist_tutorial.ipynb
  # (376,236 bytes). The planner parsed the notebook JSON and read the stored
  # stdout of the named cells first-hand.
  # Tolerance rationale: all four are exact integers that a deterministic code
  # path produces - a model's own shape, and the size of a set intersection.
  # tolerance 0 absolute is therefore the honest choice, not a strict one. The
  # tutorial's over-clustering and majority-voting outputs were deliberately NOT
  # used as claims: they run Leiden, which is seed-dependent, so a cluster id is
  # not a reproducible number.
  - id: T1
    figure: "n/a - committed notebook output, not a paper figure"
    panel: null
    metric: n_cell_types in model Immune_All_Low.pkl v2
    value: 98
    tolerance: 0
    tolerance_type: absolute
    extraction: manual
    source: >
      celltypist_tutorial.ipynb at fe357564, code cell 24 stored output:
      "CellTypist model with 98 cell types and 6639 features / date: 2022-07-16
      00:20:42.927778 / version: v2 / source: https://doi.org/10.1126/science.abl5197".
  - id: T2
    figure: "n/a - committed notebook output"
    panel: null
    metric: n_features in model Immune_All_Low.pkl v2
    value: 6639
    tolerance: 0
    tolerance_type: absolute
    extraction: manual
    source: celltypist_tutorial.ipynb at fe357564, code cell 24 stored output (same line as T1).
  - id: T3
    figure: "n/a - committed notebook output"
    panel: null
    metric: n_features used for prediction on demo_2000_cells.h5ad with Immune_All_Low.pkl
    value: 5645
    tolerance: 0
    tolerance_type: absolute
    extraction: manual
    source: >
      celltypist_tutorial.ipynb at fe357564, code cell 28 stored output:
      "Input data has 2000 cells and 18950 genes / Matching reference genes in
      the model / 5645 features used for prediction". This is the size of the
      intersection between the model's 6639 features and the demo file's 18950
      genes - a deterministic function of the two pinned artefacts, and the
      single most useful claim here because it fails loudly if either the model
      or the demo file silently changes.
  - id: T4
    figure: "n/a - committed notebook output"
    panel: null
    metric: n_genes in demo_2000_cells.h5ad after the tutorial's preprocessing
    value: 18950
    tolerance: 0
    tolerance_type: absolute
    extraction: manual
    source: celltypist_tutorial.ipynb at fe357564, code cells 9 and 28 stored outputs ("(2000, 18950)").

checkpoints:
  max_download_gb: 5     # total fetch here is 38,555,938 bytes; this will not fire
  max_stage_minutes: 60

deviations:
  # Both entries record changes relative to the procedure the repo itself states
  # (its Dockerfile at fe357564). Brief section 9.1 checkpoint 2 counts a skipped
  # step as a deviation, so they are logged here rather than only in
  # environment.notes above.
  - what: >
      `celltypist --update-models` is skipped. The model is fetched instead by an
      explicit versioned URL,
      https://celltypist.cog.sanger.ac.uk/models/Pan_Immune_CellTypist/v2/Immune_All_Low.pkl,
      and hashed like any other input (data[].model_immune_all_low_v2).
    why: >
      --update-models resolves through
      https://celltypist.cog.sanger.ac.uk/models/models.json, which is mutable and
      unversioned (last-modified 2026-03-16, nine months after the code froze on
      2025-06-25) and is checksum-free in celltypist/models.py. Fetching the
      versioned URL directly makes the model bytes pinnable and hashable. No file
      under the clone is touched; only our fetch step changes.
    approved_by: "orchestrator (recorded post-run; neither change touches the paper's code; user informed)"
    date: 2026-09-06
  - what: >
      celltypist is installed from the clone at the pinned commit
      fe357564a6625d3b1732a022fd39f18e55696e80, rather than by the repo
      Dockerfile's unversioned `pip install celltypist`.
    why: >
      The repo's Dockerfile (579 bytes at fe357564) pins nothing, so `pip install
      celltypist` would resolve to whatever version PyPI serves on the build day -
      not necessarily the code this manifest's claims were read from. Installing
      the pinned SHA keeps the code under test identical to the code cited in
      claims[].source. Dependency versions remain unpinned, as the project leaves
      them.
    approved_by: "orchestrator (recorded post-run; neither change touches the paper's code; user informed)"
    date: 2026-09-06

stages:
  - id: annotate
    cmd: ["celltypist", "--indata", "data/celltypist/demo_2000_cells.h5ad",
          "--model", "data/celltypist/Immune_All_Low.pkl", "--outdir", "out/"]
    expected_minutes: 10
