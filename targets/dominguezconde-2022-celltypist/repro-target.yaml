  total: 14

notes: >
  GATE: PASSES. Total 14, no zero in C1-C4.

  C1 scope, stated plainly. The C1=2 above is earned by the PAPER's deposited
  data - ArrayExpress E-MTAB-11536 and Zenodo 10.5281/zenodo.6334988. This
  reproduction does not use either. Its two inputs are Sanger object-store URLs
  (demo_2000_cells.h5ad and the v2 Immune_All_Low.pkl), which carry no DOI and no
  accession; they are stable and hashable, but they are not a citable deposit.
  Anyone reading C1 as a statement about the bytes this run consumed would be
  reading it wrong.

  Expected untouched outcome: UNCERTAIN, and that is the honest answer rather
  than a hedge. The annotation itself should run - the input and the model are
  both fetchable by stable URL and hash-verifiable, and the code path is
  scikit-learn logistic regression on 2000 cells. What cannot be predicted is
  whether an unpinned `pip install celltypist` resolves against a scikit-learn
  that can still unpickle a model serialised in July 2022. Open issue 164,
  "Incompatibility scikit-learn 1.8?", is exactly that question and is still
  open as of 2026-08-12. If unpickling fails, that IS the result: record it,
  record the resolved scikit-learn version in env-resolved.txt, and do not pin
  scikit-learn backwards to make it pass. Pinning a dependency the project does
  not pin, in order to turn a red run green, is the deviation this whole unit
  exists to catch.

  Why this is a candidate and not selected: C4 is 1. The claims above are real
  and checkable, but they are model and data shapes, not the paper's scientific
  results, and a reviewer is right to say so. Promoting this target properly
  means first getting the Science supplementary Data S tables, which needs a
  browser - science.org returned 403 to every scripted fetch tried on
  2026-09-06.
