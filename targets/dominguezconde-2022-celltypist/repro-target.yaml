# DRAFT manifest - Unit 1. Written by the planner on 2026-09-06.
# STATUS: candidate. Attempted only after the two selected targets are done.
# It is in the set because it is the only candidate scored here that pairs a
# real deposited data accession with a live maintainer, and because its failure
# mode - a mutable, unversioned model registry - is one the other manifests do
# not exercise.
# Every value below was read from a source opened on 2026-09-06.

schema_version: 1
slug: dominguezconde-2022-celltypist
status: candidate

paper:
  title: Cross-tissue immune cell analysis reveals tissue-specific features in humans
  doi: 10.1126/science.abl5197
  journal: Science
  year: 2022
  first_author: Dominguez Conde
  last_author: Teichmann
  url: https://doi.org/10.1126/science.abl5197
  # Europe PMC gives firstPublicationDate 2022-05-13, Science 376(6594):eabl5197,
  # PMC7612735, CC BY 4.0.

code:
  - role: package
    repo: https://github.com/Teichlab/celltypist
    # Verified 2026-09-06 with
    #   gh api repos/Teichlab/celltypist/commits/fe357564a6625d3b1732a022fd39f18e55696e80
    # -> sha matches, date 2025-06-25T21:09:27Z, message "Version 1.7.1".
    # This is also the commit behind release 1.7.1. The code has not moved since.
    commit: fe357564a6625d3b1732a022fd39f18e55696e80
    licence: MIT           # gh api repos/Teichlab/celltypist -> spdx_id MIT; LICENSE (1056 bytes) in the tree at this SHA
    entrypoint: celltypist --indata data/celltypist/demo_2000_cells.h5ad --model Immune_All_Low.pkl --outdir out/

environment:
  kind: docker
  spec: Dockerfile
  python: "3.9"            # the repo's own Dockerfile at fe357564 is FROM python:3.9-slim
  notes: >
    The repo DOES ship a Dockerfile (579 bytes at fe357564, confirmed via the
    GitHub trees API), but it pins nothing. Read verbatim, it is
    FROM python:3.9-slim, then `pip install celltypist` with no version, then
    `celltypist --update-models`. requirements.txt (126 bytes) is eight open
    lower bounds: numpy>=1.19.0, pandas>=1.0.5, scikit-learn>=0.24.1,
    openpyxl>=3.0.4, click>=7.1.2, requests>=2.23.0, scanpy>=1.7.0,
    leidenalg>=0.9.0. setup.py reads that file into install_requires with
    python_requires='>=3.6'.

    THE REPRODUCIBILITY HOLE, identified before the run. `celltypist
    --update-models` fetches https://celltypist.cog.sanger.ac.uk/models/models.json,
    which the planner fetched on 2026-09-06: HTTP 200, content-length 25568,
    last-modified Mon, 16 Mar 2026 16:08:46 GMT - nine months AFTER the code
    froze on 2025-06-25. That index is mutable and unversioned, and nothing in
    celltypist/models.py checks a checksum. Two builds of the shipped Dockerfile
    a month apart are not the same environment.

    HOW THIS MANIFEST HANDLES IT, and why that is not a deviation. The model is
    fetched by its own versioned URL and hashed like any other data file (see
    data[] below), instead of via --update-models. That is a change to OUR fetch
    step, not to the paper's code: no file under the clone is touched, and the
    bytes handed to celltypist are the same bytes --update-models would hand it
    on a day when the registry still points at v2. It is recorded here so a
    reviewer can see the choice rather than infer it. If the executor finds that
    celltypist refuses to load a model from an explicit path without the
    registry, that is a finding: stop, record it, do not patch models.py.

    There is no test suite and no CI: gh api repos/Teichlab/celltypist/contents/.github
    returns 404, and the tree at fe357564 has no tests/ directory. So nothing in
    the repo will tell you the environment drifted - which is exactly what open
    issue 164 ("Incompatibility scikit-learn 1.8?") is about.

