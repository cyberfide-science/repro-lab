notes: >
  GATE: PASSES. Total 14, no zero in C1-C4.

  Expected untouched outcome: YES. Evidence, all pre-run: the entrypoint is the
  project's own CI invocation copied verbatim from .github/workflows/test.yml at
  the pinned SHA; that workflow runs on every push to main on a stock
  ubuntu-latest image; the fixtures download under 37 MB from URLs that publish
  their own sha256; and no step needs R, a GPU, or Docker-in-Docker.

  This manifest's job in the set is insurance. If muzellec-2023-pydeseq2 runs
  untouched, this one stays status: candidate and is not attempted in Unit 1.
  If PyDESeq2 fails - the most likely cause being its filterwarnings = ["error"]
  setting tripping on a new transitive dependency - the executor runs this
  instead, with no new decisions to make, and the exit criterion is still met by
  a real paper's real code.

  Scope honesty, which the reviewer should hold this to. Passing this suite does
  NOT reproduce the paper's benchmark. The paper's numbers are the 465 rows of
  scib-reproducibility's data/metrics.csv, computed by the Snakemake pipeline on
  the figshare atlases; the sibling manifest targets/luecken-2022-scib is the one
  that attempts those and is expected to fail. What this manifest establishes is
  narrower and should be reported as such: the metrics implementation underneath
  the paper still returns the values its maintainers pinned. Any report that
  blurs the two would be exactly the overclaim this track is built to prevent.
