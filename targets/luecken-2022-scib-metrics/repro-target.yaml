# DRAFT manifest - Unit 1. Written by the planner on 2026-09-06.
# STATUS: candidate. This is the DESIGNATED FALLBACK for the exit criterion.
# It is attempted ONLY if muzellec-2023-pydeseq2 fails to run untouched. It
# exists so that outcome needs no new design decision from the executor: the
# manifest, the claims and the tolerances are already fixed and committed.
#
# Relationship to targets/luecken-2022-scib: same paper, different artefact.
# That manifest reproduces the paper's Snakemake PIPELINE against the figshare
# data and is expected to fail at the environment build. This one exercises the
# scib METRICS PACKAGE against the expected values its own maintainers committed
# in tests/. It is a narrower claim - "the metrics implementation still computes
# what its authors say it computes" - and it is stated as exactly that, not as
# a reproduction of the paper's benchmark.
# Every value below was read from a source opened on 2026-09-06.

schema_version: 1
slug: luecken-2022-scib-metrics
status: candidate

paper:
  title: Benchmarking atlas-level data integration in single-cell genomics
  doi: 10.1038/s41592-021-01336-8
  journal: Nature Methods
  year: 2022
  first_author: Luecken
  last_author: Theis
  url: https://doi.org/10.1038/s41592-021-01336-8

code:
  - role: package
    repo: https://github.com/theislab/scib
    # Verified 2026-09-06 with gh api repos/theislab/scib/commits/cd679133...
    # -> sha matches, date 2026-04-27T20:10:39Z, message
    #    "chore(main): release 1.2.1 (#434)". Same SHA as in the sibling manifest.
    commit: cd67913396b4c0430710b3d90f1d1841f5fa4468
    licence: MIT           # gh api repos/theislab/scib -> spdx_id MIT; LICENSE.txt (1052 bytes) in the tree at this SHA
    entrypoint: pytest -m "not slow" --ignore=tests/integration/ --ignore=tests/metrics/rpy2 -vv

environment:
  kind: docker
  spec: Dockerfile
  python: "3.11"           # floor from pyproject.toml at cd67913: requires-python = ">=3.11"
  notes: >
    No Dockerfile and no lock file in the tree at cd67913 (GitHub trees API,
    2026-09-06: LICENSE.txt, pyproject.toml, .github/workflows/test.yml and
    deployment.yml are the only matches for those patterns). pyproject.toml
    declares lower bounds only - numpy, pandas>=2, seaborn, matplotlib, numba,
    scanpy>=1.5, anndata>=0.7.2, h5py, scipy, scikit-learn, scikit-misc,
    leidenalg, umap-learn, pydot, igraph>=0.10, llvmlite, deprecated, zarr,
    setuptools - so the same C3 caveat applies as everywhere else in this set:
    resolve once in the image, dump env-resolved.txt, and treat the resolved
    list as the record of what ran.

    Note for the executor: tests/common.py at cd67913 sets CORES = "1", which
    agrees with the brief's section 5 instruction to pin OMP_NUM_THREADS,
    MKL_NUM_THREADS and OPENBLAS_NUM_THREADS to 1 in the image. Set them anyway;
    the package setting its own does not cover BLAS calls made outside it.

    The R-backed metrics are excluded by the entrypoint's own --ignore flags,
    which are copied verbatim from the project's .github/workflows/test.yml.
    That is the maintainers' own CI invocation, not a narrowing invented here.

data:
  # The test fixtures in tests/conftest.py at cd67913 call sc.datasets.paul15(),
  # sc.datasets.pbmc3k_processed() and sc.datasets.pbmc68k_reduced(). The first
  # two download at test time; the third is bundled in the scanpy wheel.
  # URLs and the upstream sha256 values were read on 2026-09-06 from
  #   https://raw.githubusercontent.com/scverse/scanpy/main/src/scanpy/datasets/registry.yaml
  # (1930 bytes). CAVEAT, recorded rather than glossed: that registry was read
  # from the MOVING main branch of scverse/scanpy, not a pinned SHA, because it
  # is scanpy's file and not this target's. If the executor finds different
  # bytes, that is a finding about scanpy's hosting, not about scib.
  # Sizes below are content-length values the planner measured with curl -sIL.
  - id: pbmc3k_processed
    uri: https://exampledata.scverse.org/scanpy/pbmc3k.h5ad
    # HTTP 200, Content-Length 24653425.
    # registry.yaml publishes sha256
    #   0db367b991dd95809732b218539ede489bea99113807f62ebd7ccc970025fe38
    # Do NOT paste that in by hand - run hash_data.py and check the two agree.
    # Fallback URL in the registry:
    #   https://raw.githubusercontent.com/chanzuckerberg/cellxgene/main/example-dataset/pbmc3k.h5ad
    path: data/scib-metrics/pbmc3k_processed.h5ad
    sha256: "<fill by script>"
    size_bytes: 24653425
  - id: paul15
    uri: https://exampledata.scverse.org/scanpy/paul15.h5
    # HTTP 200, Content-Length 10297693.
    # registry.yaml publishes sha256
    #   6161984f758dd464992edc23f1a8ab89b2081600130c6aa93a1ab12b3ada5bfb
    # Fallback URL in the registry: https://falexwolf.de/data/paul15.h5
    path: data/scib-metrics/paul15.h5
    sha256: "<fill by script>"
    size_bytes: 10297693
  - id: pbmc68k_reduced
    uri: https://github.com/scverse/scanpy/raw/main/src/scanpy/datasets/10x_pbmc68k_reduced.zarr.zip
    # Bundled inside the scanpy wheel, so the run does not fetch it; listed here
    # for provenance. Size 1733874 bytes, reported by the GitHub contents API.
    path: data/scib-metrics/10x_pbmc68k_reduced.zarr.zip
    sha256: "<fill by script>"
    size_bytes: 1733874

claims:
  # Pre-registered 2026-09-06, BEFORE any run. All four values, and the tolerance,
  # were read first-hand by the planner from the repo at cd67913 via
  # raw.githubusercontent.com.
  # Tolerance provenance: 1e-2 is NOT chosen here. It is the diff the maintainers
  # themselves assert at, and tests/common.py at the same SHA defines the
  # comparison as "assert abs(x - y) <= diff", i.e. ABSOLUTE. That is tolerance
  # source 1 - the authors' own stated precision - and it also settles
  # tolerance_type without guesswork.
  # These are metrics bounded in [0,1], so absolute is the right type per the
  # brief's section 4.2 regardless.
  - id: S1
    figure: "n/a - expected value committed in the repo's test suite, not a paper figure"
    panel: null
    metric: NMI, optimal-resolution Leiden cluster vs celltype, pbmc3k_processed + pbmc68k_reduced fixture
    value: 0.7424614219722735
    tolerance: 0.01
    tolerance_type: absolute
    extraction: manual
    source: >
      theislab/scib@cd67913 tests/metrics/test_cluster_metrics.py, def test_nmi,
      line 23: assert_near_exact(score, 0.7424614219722735, diff=1e-2).
  - id: S2
    figure: "n/a - expected value committed in the repo's test suite"
    panel: null
    metric: ARI, same clustering and fixture as S1
    value: 0.7614422905830917
    tolerance: 0.01
    tolerance_type: absolute
    extraction: manual
    source: >
      theislab/scib@cd67913 tests/metrics/test_cluster_metrics.py, def test_ari,
      line 29: assert_near_exact(score, 0.7614422905830917, diff=1e-2).
  - id: S3
    figure: "n/a - expected value committed in the repo's test suite"
    panel: null
    metric: cLISI (scaled), type_="full"
    value: 0.975
    tolerance: 0.01
    tolerance_type: absolute
    extraction: manual
    source: >
      theislab/scib@cd67913 tests/metrics/test_clisi.py, def test_clisi_full,
      line 16: assert_near_exact(score, 0.975, diff=1e-2).
  - id: S4
    figure: "n/a - expected value committed in the repo's test suite"
    panel: null
    metric: cLISI (scaled), PCA embedding and kNN graph
    value: 0.982
    tolerance: 0.01
    tolerance_type: absolute
    extraction: manual
    source: >
      theislab/scib@cd67913 tests/metrics/test_clisi.py, def test_clisi_embed
      line 30 and def test_clisi_knn line 43, both
      assert_near_exact(score, 0.982, diff=1e-2).

